name: Update Version and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract latest version from CHANGELOG.md
        id: get_version
        run: |
          if [ ! -f CHANGELOG.md ]; then
            # release-please creates CHANGELOG.md on the first release;
            # nothing to do until then.
            echo "CHANGELOG.md not found yet — nothing to do."
            exit 0
          fi

          VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract a version from CHANGELOG.md"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version in cmd/main.go
        if: steps.get_version.outputs.VERSION != ''
        run: |
          sed -i "s/const version = \".*\"/const version = \"${{ steps.get_version.outputs.VERSION }}\"/" cmd/main.go

      - name: Commit and push if changed
        if: steps.get_version.outputs.VERSION != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/main.go

          if git diff --cached --quiet; then
            echo "Version in cmd/main.go already up to date."
          else
            git commit -m "chore: update API version to ${{ steps.get_version.outputs.VERSION }}"
            git push
          fi
